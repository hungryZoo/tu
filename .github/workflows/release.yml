name: release

# Builds every supported target with cargo-zigbuild on one Ubuntu
# runner, packages tarballs / .deb / .rpm, and publishes a GitHub
# release. Nothing is tagged until the build and packaging have
# succeeded, so a failed run leaves no half-finished tag behind.
#
# Homebrew tap + crates.io are updated afterwards from a developer
# machine with `scripts/post-release.sh` (uses the local `gh` login and
# `cargo login`; no repository secrets needed).
#
# Two ways in:
#   * push a tag `vX.Y.Z`                     -> releases that tag
#   * Actions > release > Run workflow        -> builds the chosen ref
#     (X.Y.Z read from Cargo.toml), then creates tag vX.Y.Z on it if the
#     tag doesn't exist yet. A tag that already has a published release
#     is released as-is (that commit is checked out first).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and ref
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/meta.sh
          TAG="v$VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag_version" != "$VERSION" ]]; then
              echo "tag v$tag_version does not match Cargo.toml version $VERSION" >&2
              exit 1
            fi
            mode=tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 \
               && gh release view "$TAG" >/dev/null 2>&1; then
            # Manual re-run of an already-published version: rebuild
            # exactly what was released, not whatever main is now.
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout -q "$TAG"
            source scripts/meta.sh
            echo "$TAG already has a release; rebuilding its commit"
            mode=republish
          else
            mode=new
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode version=$VERSION bin=$BIN"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-darwin,
            x86_64-apple-darwin,
            x86_64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
            aarch64-unknown-linux-gnu,
            aarch64-unknown-linux-musl,
            armv7-unknown-linux-gnueabihf,
            arm-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild, cargo-deb, cargo-generate-rpm
        run: |
          set -euo pipefail
          pip install --quiet cargo-zigbuild ziglang
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-deb cargo-generate-rpm \
            || cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build all targets
        env:
          BIN: ${{ steps.ver.outputs.bin }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for t in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl \
            armv7-unknown-linux-gnueabihf \
            arm-unknown-linux-gnueabihf \
            aarch64-apple-darwin \
            x86_64-apple-darwin; do
            echo "::group::$t"
            cargo zigbuild --release --target "$t"
            test -f "target/$t/release/$BIN" || { echo "no target/$t/release/$BIN"; ls "target/$t/release"; exit 1; }
            echo "::endgroup::"
          done
          "./target/x86_64-unknown-linux-gnu/release/$BIN" --version | grep -F "$BIN $VERSION"

      - name: Package
        run: bash scripts/package-all.sh

      # Everything above succeeded: only now touch refs.
      - name: Create tag (manual run of a new version)
        if: steps.ver.outputs.mode == 'new'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            # Exists but has no release: a failed earlier attempt. Point
            # it at the commit we just built and verified.
            echo "$TAG exists without a release; moving it to $(git rev-parse --short HEAD)"
            git tag -f -a "$TAG" -m "tu $VERSION"
            git push --force origin "refs/tags/$TAG"
          else
            git tag -a "$TAG" -m "tu $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing assets"
          elif [[ -f "$notes" ]]; then
            title="$(sed -n '1s/^# *//p' "$notes")"
            gh release create "$TAG" --title "${title:-tu $VERSION}" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" --title "tu $VERSION" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
